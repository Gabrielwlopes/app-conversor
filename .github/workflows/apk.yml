# Compila o APK a cada envio para a branch main (e quando você clica em "Run workflow" na aba Actions).
#   apk:       gera o APK assinado (celulares ARM de 64 e 32 bits)
#   autoteste: gera uma versão de teste, liga um Android emulado e converte arquivos de exemplo de verdade
#   release:   se as duas deram certo, publica o APK em Releases (para baixar direto no celular)
name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # para criar a Release com o APK

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      name: ${{ steps.apk.outputs.name }}
      version: ${{ steps.apk.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # traz o Filee (external/Filee)

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Instalar o suporte a Android do .NET
        run: dotnet workload install android

      - name: Testar o núcleo (formatos e TIFF)
        run: dotnet run --project tests/Conversor.Core.Checks -c Release

      - name: Instalar o que falta do Android SDK
        run: >
          dotnet build src/Conversor.App/Conversor.App.csproj
          -t:InstallAndroidDependencies -f net10.0-android
          "-p:AndroidSdkDirectory=$ANDROID_SDK_ROOT" "-p:AcceptAndroidSDKLicenses=True"

      - name: Gerar o APK
        run: >
          dotnet publish src/Conversor.App/Conversor.App.csproj
          -f net10.0-android -c Release
          "-p:AndroidSdkDirectory=$ANDROID_SDK_ROOT"
          -o out

      - name: Preparar o arquivo
        id: apk
        run: |
          apk=$(find out src/Conversor.App/bin -name '*-Signed.apk' | head -n 1)
          test -n "$apk" || { echo "APK não encontrado"; exit 1; }
          version=$(grep -oP '(?<=<ApplicationDisplayVersion>)[^<]+' src/Conversor.App/Conversor.App.csproj)
          name="Conversor-${version}-build${GITHUB_RUN_NUMBER}.apk"
          cp "$apk" "$name"
          echo "Tamanho: $(du -h "$name" | cut -f1)"
          unzip -l "$name" | grep -E '\.so$' | sort -k1 -n -r | head -20
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

  autoteste:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Instalar o suporte a Android do .NET
        run: dotnet workload install android

      - name: Instalar o que falta do Android SDK
        run: >
          dotnet build src/Conversor.App/Conversor.App.csproj
          -t:InstallAndroidDependencies -f net10.0-android
          "-p:AndroidSdkDirectory=$ANDROID_SDK_ROOT" "-p:AcceptAndroidSDKLicenses=True"

      - name: Gerar o APK de teste (x86_64, com autoteste)
        run: >
          dotnet publish src/Conversor.App/Conversor.App.csproj
          -f net10.0-android -c Release
          "-p:AndroidSdkDirectory=$ANDROID_SDK_ROOT"
          -p:ConversorSelfTest=true
          -o test-out

      - name: Ativar KVM (emulador rápido)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Converter arquivos de exemplo num Android 13 emulado
        run: bash .github/scripts/emulador.sh test-out

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: autoteste
          path: |
            autoteste/
            emulador.log
          if-no-files-found: ignore

      # Guarda as capturas de tela e os registros do autoteste na branch "autoteste" (fácil de abrir no GitHub).
      - name: Publicar o relatório do autoteste
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report=$(mktemp -d)
          cp -r autoteste "$report/" 2>/dev/null || true
          cp emulador.log "$report/" 2>/dev/null || true
          cd "$report"
          printf '# Autoteste — execução %s (commit %s)\n\n' "$GITHUB_RUN_NUMBER" "${GITHUB_SHA::7}" > README.md
          if [ -f autoteste/resultado.txt ]; then sed 's/^/    /' autoteste/resultado.txt >> README.md; fi
          for image in autoteste/*.png; do [ -f "$image" ] && printf '\n![%s](%s)\n' "$image" "$image" >> README.md; done
          git init -q -b autoteste
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Autoteste da execução $GITHUB_RUN_NUMBER"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" autoteste

  release:
    needs: [apk, autoteste]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: apk

      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ needs.apk.outputs.name }}
          VERSION: ${{ needs.apk.outputs.version }}
        run: |
          tag="v${VERSION}-build${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "$NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Conversor ${VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --notes "APK gerado e testado automaticamente a partir do commit ${GITHUB_SHA::7}. Baixe o arquivo .apk abaixo no celular para instalar." \
            --target "$GITHUB_SHA"
